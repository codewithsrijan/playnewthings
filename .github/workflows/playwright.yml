name: Playwright Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-traces
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy-report:
    needs: test
    if: ${{ always() && needs.test.result != 'cancelled' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Playwright report
        id: download-report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-and-traces
          path: report-artifacts

      - name: Configure GitHub Pages
        if: steps.download-report.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload report for GitHub Pages
        id: upload-pages-artifact
        if: steps.download-report.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: report-artifacts/playwright-report

      - name: Deploy report to GitHub Pages
        id: deployment
        if: steps.upload-pages-artifact.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Explain skipped deployment
        if: steps.download-report.outcome != 'success'
        run: echo "The Playwright report artifact was not created, so there is no report to publish."
